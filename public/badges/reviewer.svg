<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="rv-title">
  <title id="rv-title">Reviewer</title>
  <style>
    /* ===== entrada ===== */
    /* medalhão aparece crescendo */
    .rv-medal { transform-box: view-box; transform-origin: 128px 128px;
      animation: rv-pop .7s cubic-bezier(.3,1.5,.5,1) both; }
    @keyframes rv-pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
    .rv-ribbon { transform-box: fill-box; transform-origin: 50% 0; animation: rv-unfurl .7s cubic-bezier(.2,.8,.3,1) .7s both; }
    @keyframes rv-unfurl { from { transform: scaleY(0); } to { transform: none; } }
    .rv-jewel { transform-box: fill-box; transform-origin: center; animation: rv-jewel .5s cubic-bezier(.3,1.6,.5,1) 1.1s both; }
    @keyframes rv-jewel { from { opacity: 0; transform: scale(0) rotate(-180deg); } to { opacity: 1; transform: none; } }
    /* ícone se desenha */
    .rv-icon path, .rv-icon circle { stroke-dasharray: 100; animation: rv-draw .9s cubic-bezier(.6,0,.3,1) .8s both; }
    @keyframes rv-draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    .rv-icon { transform-box: view-box; transform-origin: 128px 128px; animation: rv-icon-pop .6s cubic-bezier(.3,1.6,.5,1) .8s both; }
    @keyframes rv-icon-pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
    /* clarão de entrada */
    .rv-burst { transform-box: view-box; transform-origin: 128px 128px; opacity: 0; animation: rv-burst .9s ease-out .9s both; }
    @keyframes rv-burst { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: .85; } 100% { opacity: 0; transform: scale(1.45); } }

    /* ===== aura ===== */
    .rv-aura-in { opacity: 0; animation: rv-fade 1s ease-out 1s forwards; }
    @keyframes rv-fade { to { opacity: 1; } }
    .rv-halo { transform-box: view-box; transform-origin: 128px 128px; animation: rv-spin 22s linear infinite; }
    .rv-halo--b { animation: rv-spin-rev 34s linear infinite; }
    @keyframes rv-spin { to { transform: rotate(360deg); } }
    @keyframes rv-spin-rev { to { transform: rotate(-360deg); } }
    /* faíscas orbitando */
    .rv-orbit { transform-box: view-box; transform-origin: 128px 128px; animation: rv-spin 9s linear infinite; }
    .rv-spark { transform-box: fill-box; transform-origin: center; animation: rv-twinkle 1.8s ease-in-out infinite; }
    .rv-spark:nth-child(2) { animation-delay: -.6s; }
    .rv-spark:nth-child(3) { animation-delay: -1.2s; }
    @keyframes rv-twinkle { 0%, 100% { opacity: .2; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.1); } }

    @media (prefers-reduced-motion: reduce) {
      .rv-root * { animation: none !important; }
      .rv-burst { opacity: 0; }
      .rv-aura-in { opacity: 1; }
    }
  </style>
  <defs>
    <filter id="rv-aura-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="rv-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="rv-burst-grad"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#ffe2a8" stop-opacity=".7"/><stop offset="1" stop-color="#ffb02e" stop-opacity="0"/></radialGradient>
  </defs>

  <g class="rv-root">
  <!-- aura -->
  <g class="rv-aura-in">
    <circle class="rv-halo" cx="128" cy="128" r="103" fill="none" stroke="#ffb02e" stroke-width="1.6" stroke-dasharray="3 9" stroke-linecap="round" opacity=".7"/>
    <circle class="rv-halo rv-halo--b" cx="128" cy="128" r="109" fill="none" stroke="#ffe2a8" stroke-width="1" stroke-dasharray="18 14" opacity=".35"/>
    <g class="rv-orbit" fill="#fff" filter="url(#rv-glow)"><polygon class="rv-spark" points="181.0,30.2 182.6,34.6 187.0,36.2 182.6,37.8 181.0,42.2 179.4,37.8 175.0,36.2 179.4,34.6"/><polygon class="rv-spark" points="181.0,213.8 182.6,218.2 187.0,219.8 182.6,221.4 181.0,225.8 179.4,221.4 175.0,219.8 179.4,218.2"/><polygon class="rv-spark" points="22.0,122.0 23.6,126.4 28.0,128.0 23.6,129.6 22.0,134.0 20.4,129.6 16.0,128.0 20.4,126.4"/></g>
  </g>

  <!-- fitas -->
  <g class="badge-ribbons">
    <g class="rv-ribbon"><polygon points="96.0,168.0 120.0,178.0 108.0,246.0 95.0,234.0 82.0,242.0" fill="#e38a0b" stroke="#0b0d14" stroke-width="2.5" stroke-linejoin="round"/><polygon points="96.0,168.0 120.0,178.0 114.0,212.0 89.0,205.0" fill="#ffe2a8" opacity=".35"/></g>
    <g class="rv-ribbon"><polygon points="160.0,168.0 136.0,178.0 148.0,246.0 161.0,234.0 174.0,242.0" fill="#e38a0b" stroke="#0b0d14" stroke-width="2.5" stroke-linejoin="round"/><polygon points="160.0,168.0 136.0,178.0 142.0,212.0 167.0,205.0" fill="#ffe2a8" opacity=".35"/></g>
  </g>

  <!-- medalhão facetado -->
  <g class="badge-medal rv-medal">
    <polygon points="128.0,41.6 171.2,53.2 202.8,84.8 214.4,128.0 202.8,171.2 171.2,202.8 128.0,214.4 84.8,202.8 53.2,171.2 41.6,128.0 53.2,84.8 84.8,53.2" fill="#1b1f2b" stroke="#0b0d14" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="128.0,47.4 168.3,58.2 197.8,87.7 208.6,128.0 197.8,168.3 168.3,197.8 128.0,208.6 87.7,197.8 58.2,168.3 47.4,128.0 58.2,87.7 87.7,58.2" fill="none" stroke="#ffb02e" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="128.0,56.0 164.0,65.6 190.4,92.0 200.0,128.0 190.4,164.0 164.0,190.4 128.0,200.0 92.0,190.4 65.6,164.0 56.0,128.0 65.6,92.0 92.0,65.6" transform="translate(0 4)" fill="#000" opacity=".35"/>
    <polygon points="128.0,56.0 164.0,65.6 146.7,95.6 128.0,90.6" fill="#e8ca93"/><polygon points="164.0,65.6 190.4,92.0 160.4,109.3 146.7,95.6" fill="#c1a370"/><polygon points="190.4,92.0 200.0,128.0 165.4,128.0 160.4,109.3" fill="#927345"/><polygon points="200.0,128.0 190.4,164.0 160.4,146.7 165.4,128.0" fill="#68491f"/><polygon points="190.4,164.0 164.0,190.4 146.7,160.4 160.4,146.7" fill="#4f2f08"/><polygon points="164.0,190.4 128.0,200.0 128.0,165.4 146.7,160.4" fill="#4c2c06"/><polygon points="128.0,200.0 92.0,190.4 109.3,160.4 128.0,165.4" fill="#614219"/><polygon points="92.0,190.4 65.6,164.0 95.6,146.7 109.3,160.4" fill="#88693c"/><polygon points="65.6,164.0 56.0,128.0 90.6,128.0 95.6,146.7" fill="#b79967"/><polygon points="56.0,128.0 65.6,92.0 95.6,109.3 90.6,128.0" fill="#e1c38d"/><polygon points="65.6,92.0 92.0,65.6 109.3,95.6 95.6,109.3" fill="#fadda4"/><polygon points="92.0,65.6 128.0,56.0 128.0,90.6 109.3,95.6" fill="#fde0a6"/>
    <polygon points="128.0,90.6 146.7,95.6 160.4,109.3 165.4,128.0 160.4,146.7 146.7,160.4 128.0,165.4 109.3,160.4 95.6,146.7 90.6,128.0 95.6,109.3 109.3,95.6" fill="#e38a0b"/>
    <polygon points="128.0,56.0 164.0,65.6 190.4,92.0 200.0,128.0 190.4,164.0 164.0,190.4 128.0,200.0 92.0,190.4 65.6,164.0 56.0,128.0 65.6,92.0 92.0,65.6" fill="none" stroke="#0b0d14" stroke-width="3" stroke-linejoin="round"/>
    <!-- ícone -->
    <g transform="translate(0 3)" opacity=".3"><g fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path pathLength="100" d="M140 103 L153 116 L119 150 L101 155 L106 137 Z"/><path pathLength="100" d="M133 110 L146 123"/><path pathLength="100" d="M128 157 H156"/></g></g>
    <g class="rv-icon"><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path pathLength="100" d="M140 103 L153 116 L119 150 L101 155 L106 137 Z"/><path pathLength="100" d="M133 110 L146 123"/><path pathLength="100" d="M128 157 H156"/></g></g>
  </g>

  <!-- clarão de entrada -->
  <circle class="rv-burst" cx="128" cy="128" r="72" fill="url(#rv-burst-grad)"/>

  <!-- gema de exclusividade -->
  <g class="rv-jewel"><polygon points="128.0,30.0 136.0,39.0 128.0,39.0" fill="#fff"/><polygon points="136.0,39.0 128.0,48.0 128.0,39.0" fill="#ffb02e"/><polygon points="128.0,48.0 120.0,39.0 128.0,39.0" fill="#e38a0b"/><polygon points="120.0,39.0 128.0,30.0 128.0,39.0" fill="#ffe2a8"/><polygon points="128.0,30.0 136.0,39.0 128.0,48.0 120.0,39.0" fill="none" stroke="#0b0d14" stroke-width="2" stroke-linejoin="round"/></g>

  </g>
</svg>
