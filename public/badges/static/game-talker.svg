<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="gt-title">
  <title id="gt-title">Voz dos Games</title>
  <style>
    /* ===== entrada ===== */
    /* medalhão aparece crescendo */
    .gt-medal { transform-box: view-box; transform-origin: 128px 128px;
      animation: gt-pop .7s cubic-bezier(.3,1.5,.5,1) both; }
    @keyframes gt-pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
    .gt-ribbon { transform-box: fill-box; transform-origin: 50% 0; animation: gt-unfurl .7s cubic-bezier(.2,.8,.3,1) .7s both; }
    @keyframes gt-unfurl { from { transform: scaleY(0); } to { transform: none; } }
    .gt-jewel { transform-box: fill-box; transform-origin: center; animation: gt-jewel .5s cubic-bezier(.3,1.6,.5,1) 1.1s both; }
    @keyframes gt-jewel { from { opacity: 0; transform: scale(0) rotate(-180deg); } to { opacity: 1; transform: none; } }
    /* ícone se desenha */
    .gt-icon path, .gt-icon circle { stroke-dasharray: 100; animation: gt-draw .9s cubic-bezier(.6,0,.3,1) .8s both; }
    @keyframes gt-draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    .gt-icon { transform-box: view-box; transform-origin: 128px 128px; animation: gt-icon-pop .6s cubic-bezier(.3,1.6,.5,1) .8s both; }
    @keyframes gt-icon-pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
    /* clarão de entrada */
    .gt-burst { transform-box: view-box; transform-origin: 128px 128px; opacity: 0; animation: gt-burst .9s ease-out .9s both; }
    @keyframes gt-burst { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: .85; } 100% { opacity: 0; transform: scale(1.45); } }

    /* ===== aura ===== */
    .gt-aura-in { opacity: 0; animation: gt-fade 1s ease-out 1s forwards; }
    @keyframes gt-fade { to { opacity: 1; } }
    .gt-halo { transform-box: view-box; transform-origin: 128px 128px; animation: gt-spin 22s linear infinite; }
    .gt-halo--b { animation: gt-spin-rev 34s linear infinite; }
    @keyframes gt-spin { to { transform: rotate(360deg); } }
    @keyframes gt-spin-rev { to { transform: rotate(-360deg); } }
    /* faíscas orbitando */
    .gt-orbit { transform-box: view-box; transform-origin: 128px 128px; animation: gt-spin 9s linear infinite; }
    .gt-spark { transform-box: fill-box; transform-origin: center; animation: gt-twinkle 1.8s ease-in-out infinite; }
    .gt-spark:nth-child(2) { animation-delay: -.6s; }
    .gt-spark:nth-child(3) { animation-delay: -1.2s; }
    @keyframes gt-twinkle { 0%, 100% { opacity: .2; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.1); } }

    @media all {
      .gt-root * { animation: none !important; }
      .gt-burst { opacity: 0; }
      .gt-aura-in { opacity: 1; }
    }
  </style>
  <defs>
    <filter id="gt-aura-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="gt-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="gt-burst-grad"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#c4ecff" stop-opacity=".7"/><stop offset="1" stop-color="#4cc3ff" stop-opacity="0"/></radialGradient>
  </defs>

  <g class="gt-root">
  <!-- aura -->
  <g class="gt-aura-in">
    <circle class="gt-halo" cx="128" cy="128" r="103" fill="none" stroke="#4cc3ff" stroke-width="1.6" stroke-dasharray="3 9" stroke-linecap="round" opacity=".7"/>
    <circle class="gt-halo gt-halo--b" cx="128" cy="128" r="109" fill="none" stroke="#c4ecff" stroke-width="1" stroke-dasharray="18 14" opacity=".35"/>
    <g class="gt-orbit" fill="#fff" filter="url(#gt-glow)"><polygon class="gt-spark" points="181.0,30.2 182.6,34.6 187.0,36.2 182.6,37.8 181.0,42.2 179.4,37.8 175.0,36.2 179.4,34.6"/><polygon class="gt-spark" points="181.0,213.8 182.6,218.2 187.0,219.8 182.6,221.4 181.0,225.8 179.4,221.4 175.0,219.8 179.4,218.2"/><polygon class="gt-spark" points="22.0,122.0 23.6,126.4 28.0,128.0 23.6,129.6 22.0,134.0 20.4,129.6 16.0,128.0 20.4,126.4"/></g>
  </g>

  <!-- fitas -->
  <g class="badge-ribbons">
    <g class="gt-ribbon"><polygon points="96.0,168.0 120.0,178.0 108.0,246.0 95.0,234.0 82.0,242.0" fill="#1f9be0" stroke="#0b0d14" stroke-width="2.5" stroke-linejoin="round"/><polygon points="96.0,168.0 120.0,178.0 114.0,212.0 89.0,205.0" fill="#c4ecff" opacity=".35"/></g>
    <g class="gt-ribbon"><polygon points="160.0,168.0 136.0,178.0 148.0,246.0 161.0,234.0 174.0,242.0" fill="#1f9be0" stroke="#0b0d14" stroke-width="2.5" stroke-linejoin="round"/><polygon points="160.0,168.0 136.0,178.0 142.0,212.0 167.0,205.0" fill="#c4ecff" opacity=".35"/></g>
  </g>

  <!-- medalhão facetado -->
  <g class="badge-medal gt-medal">
    <polygon points="128.0,41.6 171.2,53.2 202.8,84.8 214.4,128.0 202.8,171.2 171.2,202.8 128.0,214.4 84.8,202.8 53.2,171.2 41.6,128.0 53.2,84.8 84.8,53.2" fill="#1b1f2b" stroke="#0b0d14" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="128.0,47.4 168.3,58.2 197.8,87.7 208.6,128.0 197.8,168.3 168.3,197.8 128.0,208.6 87.7,197.8 58.2,168.3 47.4,128.0 58.2,87.7 87.7,58.2" fill="none" stroke="#4cc3ff" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="128.0,56.0 164.0,65.6 190.4,92.0 200.0,128.0 190.4,164.0 164.0,190.4 128.0,200.0 92.0,190.4 65.6,164.0 56.0,128.0 65.6,92.0 92.0,65.6" transform="translate(0 4)" fill="#000" opacity=".35"/>
    <polygon points="128.0,56.0 164.0,65.6 146.7,95.6 128.0,90.6" fill="#acd4e8"/><polygon points="164.0,65.6 190.4,92.0 160.4,109.3 146.7,95.6" fill="#83abc1"/><polygon points="190.4,92.0 200.0,128.0 165.4,128.0 160.4,109.3" fill="#527b92"/><polygon points="200.0,128.0 190.4,164.0 160.4,146.7 165.4,128.0" fill="#264f68"/><polygon points="190.4,164.0 164.0,190.4 146.7,160.4 160.4,146.7" fill="#0b354f"/><polygon points="164.0,190.4 128.0,200.0 128.0,165.4 146.7,160.4" fill="#08324c"/><polygon points="128.0,200.0 92.0,190.4 109.3,160.4 128.0,165.4" fill="#1e4861"/><polygon points="92.0,190.4 65.6,164.0 95.6,146.7 109.3,160.4" fill="#477188"/><polygon points="65.6,164.0 56.0,128.0 90.6,128.0 95.6,146.7" fill="#78a1b7"/><polygon points="56.0,128.0 65.6,92.0 95.6,109.3 90.6,128.0" fill="#a4cde1"/><polygon points="65.6,92.0 92.0,65.6 109.3,95.6 95.6,109.3" fill="#bfe7fa"/><polygon points="92.0,65.6 128.0,56.0 128.0,90.6 109.3,95.6" fill="#c2eafd"/>
    <polygon points="128.0,90.6 146.7,95.6 160.4,109.3 165.4,128.0 160.4,146.7 146.7,160.4 128.0,165.4 109.3,160.4 95.6,146.7 90.6,128.0 95.6,109.3 109.3,95.6" fill="#1f9be0"/>
    <polygon points="128.0,56.0 164.0,65.6 190.4,92.0 200.0,128.0 190.4,164.0 164.0,190.4 128.0,200.0 92.0,190.4 65.6,164.0 56.0,128.0 65.6,92.0 92.0,65.6" fill="none" stroke="#0b0d14" stroke-width="3" stroke-linejoin="round"/>
    <!-- ícone -->
    <g transform="translate(0 3)" opacity=".3"><g transform="translate(128 129) scale(.82) translate(-128 -129)"><g fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path pathLength="100" d="M105 106 H151 Q158 106 158 113 V135 Q158 142 151 142 H126 L113 153 V142 H105 Q98 142 98 135 V113 Q98 106 105 106 Z"/><path pathLength="100" d="M112 124 H124 M118 118 V130"/></g><circle cx="137" cy="127" r="3.6" fill="#000"/><circle cx="145" cy="120" r="3.6" fill="#000"/></g></g>
    <g class="gt-icon"><g transform="translate(128 129) scale(.82) translate(-128 -129)"><g fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path pathLength="100" d="M105 106 H151 Q158 106 158 113 V135 Q158 142 151 142 H126 L113 153 V142 H105 Q98 142 98 135 V113 Q98 106 105 106 Z"/><path pathLength="100" d="M112 124 H124 M118 118 V130"/></g><circle cx="137" cy="127" r="3.6" fill="#fff"/><circle cx="145" cy="120" r="3.6" fill="#fff"/></g></g>
  </g>

  <!-- clarão de entrada -->
  <circle class="gt-burst" cx="128" cy="128" r="72" fill="url(#gt-burst-grad)"/>

  <!-- gema de exclusividade -->
  <g class="gt-jewel"><polygon points="128.0,30.0 136.0,39.0 128.0,39.0" fill="#fff"/><polygon points="136.0,39.0 128.0,48.0 128.0,39.0" fill="#4cc3ff"/><polygon points="128.0,48.0 120.0,39.0 128.0,39.0" fill="#1f9be0"/><polygon points="120.0,39.0 128.0,30.0 128.0,39.0" fill="#c4ecff"/><polygon points="128.0,30.0 136.0,39.0 128.0,48.0 120.0,39.0" fill="none" stroke="#0b0d14" stroke-width="2" stroke-linejoin="round"/></g>

  </g>
</svg>
