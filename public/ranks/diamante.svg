<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="op-title">
  <title id="op-title">Diamante</title>
  <style>
    /* ===== construção (tier 5) ===== */
    .op-ring { stroke-dasharray: 100; animation: op-draw 1.1s cubic-bezier(.6,0,.3,1) 0.45s both; }
    @keyframes op-draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    .op-symbol { transform-box: view-box; transform-origin: 128px 128px;
      animation: op-pop .5s cubic-bezier(.3,1.6,.5,1) 2.35s both; }
    @keyframes op-pop { from { opacity: 0; transform: scale(.2) rotate(-120deg); } to { opacity: 1; transform: none; } }
    .op-table { transform-box: view-box; transform-origin: 128px 128px;
      animation: op-table .45s ease-out 2.10s both; }
    @keyframes op-table { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
    .op-plate { transform-box: view-box; transform-origin: 128px 128px;
      animation: op-plate .6s ease-out both; }
    @keyframes op-plate { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
    .op-facet { animation: op-facet .55s cubic-bezier(.2,.8,.3,1) both; }
    @keyframes op-facet { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } to { opacity: 1; transform: none; } }
    .op-edge { animation: op-fade .4s ease-out 2.20s both; }
    @keyframes op-fade { from { opacity: 0; } to { opacity: 1; } }
    .op-gem { transform-box: view-box; transform-origin: 128px 128px;
      animation: op-spin 1.6s cubic-bezier(.2,.8,.2,1) .2s both; }
    @keyframes op-spin { from { transform: rotate(-60deg) scale(.8); } to { transform: none; } }
    .op-flash { transform-box: view-box; transform-origin: 128px 128px; opacity: 0;
      animation: op-flash .8s ease-out 2.60s both; }
    @keyframes op-flash { 0% { opacity: 0; transform: scale(.3); } 25% { opacity: .9; } 100% { opacity: 0; transform: scale(1.5); } }
    /* ===== aura (nível 3) ===== */
    .op-aura-in { opacity: 0; animation: op-aura-in 1s ease-out 2.40s forwards; }
    @keyframes op-aura-in { to { opacity: 1; } }
    .op-mote { opacity: 0; animation-name: op-mote; animation-timing-function: ease-out; animation-iteration-count: infinite; }
    @keyframes op-mote {
      0%   { opacity: 0; transform: translateY(0); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-105px); }
    }
    .op-shard { opacity: 0; animation: op-shard-in .5s cubic-bezier(.3,1.5,.5,1) forwards, op-bob 3s ease-in-out infinite; }
    @keyframes op-shard-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes op-bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(var(--sx), var(--sy)); } }
    .op-wave { opacity: 0; transform-box: view-box; transform-origin: 128px 128px;
      animation: op-wave 3.4s cubic-bezier(.2,.6,.3,1) 2.80s infinite; }
    .op-wave--b { animation-delay: 4.50s; }
    @keyframes op-wave { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12); } }
    /* marcadores de tier: surgem um a um, devagar, e ficam */
    .op-tick { opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: op-tick-in 0.9s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes op-tick-in {
      0%   { opacity: 0; transform: scale(.3); }
      60%  { opacity: 1; transform: scale(1.25); }
      100% { opacity: 1; transform: scale(1); }
    }
    /* brilho atravessando o emblema inteiro, em loop */
    .op-shine { opacity: 0; animation: op-shine 4.0s ease-in-out 6.00s infinite; }
    @keyframes op-shine {
      0%   { transform: translateX(0); opacity: 0; }
      4%   { opacity: 1; }
      32%  { transform: translateX(285px); opacity: 1; }
      33%, 100% { transform: translateX(285px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .op-root * { animation: none !important; }
      .op-tick, .op-aura-in, .op-shard { opacity: 1; }
      .op-shine, .op-flash, .op-wave, .op-mote { opacity: 0; }
    }
  </style>
  <defs>
    <filter id="op-aura-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter><filter id="op-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="op-shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="op-flash-grad">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#ffd27a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffc443" stop-opacity="0"/>
    </radialGradient>
    <mask id="op-shine-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <polygon points="128.0,27.2 165.2,63.6 215.3,77.6 202.4,128.0 215.3,178.4 165.2,192.4 128.0,228.8 90.8,192.4 40.7,178.4 53.6,128.0 40.7,77.6 90.8,63.6" fill="#fff" fill-opacity=".18"/>
      <polygon points="128.0,33.9 162.7,67.9 209.5,81.0 197.4,128.0 209.5,175.0 162.7,188.1 128.0,222.1 93.3,188.1 46.5,175.0 58.6,128.0 46.5,81.0 93.3,67.9" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="128.0,44.0 159.0,74.3 200.7,86.0 190.0,128.0 200.7,170.0 159.0,181.7 128.0,212.0 97.0,181.7 55.3,170.0 66.0,128.0 55.3,86.0 97.0,74.3" fill="#fff" fill-opacity=".5"/>
      <polygon points="128.0,98.6 138.8,109.2 153.5,113.3 149.7,128.0 153.5,142.7 138.8,146.8 128.0,157.4 117.2,146.8 102.5,142.7 106.3,128.0 102.5,113.3 117.1,109.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
      <polygon points="128.0,110.4 134.5,116.7 143.3,119.2 141.0,128.0 143.3,136.8 134.5,139.3 128.0,145.6 121.5,139.3 112.7,136.8 115.0,128.0 112.7,119.2 121.5,116.7" fill="#fff"/>
    </mask>
  </defs>

  <g class="op-root">
  <!-- aura -->
  <g class="op-aura-in"><polygon points="128.0,23.0 166.8,60.9 218.9,75.5 205.5,128.0 218.9,180.5 166.8,195.1 128.0,233.0 89.3,195.1 37.1,180.5 50.5,128.0 37.1,75.5 89.2,60.9" fill="#ffc443" opacity="0.55" filter="url(#op-aura-blur)"/><g fill="#ffd27a" filter="url(#op-glow)"><circle class="op-mote" cx="44.0" cy="174.2" r="2.1" style="animation-duration:3.20s;animation-delay:0.00s"/><circle class="op-mote" cx="217.0" cy="174.2" r="2.5" style="animation-duration:4.60s;animation-delay:3.90s"/><circle class="op-mote" cx="33.9" cy="174.2" r="2.9" style="animation-duration:4.25s;animation-delay:2.85s"/><circle class="op-mote" cx="214.5" cy="174.2" r="3.3" style="animation-duration:3.90s;animation-delay:1.80s"/><circle class="op-mote" cx="36.4" cy="174.2" r="2.1" style="animation-duration:3.55s;animation-delay:0.75s"/><circle class="op-mote" cx="212.0" cy="174.2" r="2.5" style="animation-duration:3.20s;animation-delay:2.90s"/><circle class="op-mote" cx="39.0" cy="174.2" r="2.9" style="animation-duration:4.60s;animation-delay:0.40s"/></g><g filter="url(#op-glow)"><g class="op-shard" style="--sx:2.00px;--sy:-3.46px;animation-delay:3.00s, 0.00s"><polygon points="180.5,37.0 179.2,48.9 171.7,52.2" fill="#ffd27a"/><polygon points="180.5,37.0 171.7,52.2 170.9,44.1" fill="#dd3b25"/><polygon points="180.5,37.0 179.2,48.9 171.7,52.2 170.9,44.1" fill="none" stroke="#0b0d14" stroke-width="1.4" stroke-linejoin="round"/></g><g class="op-shard" style="--sx:4.00px;--sy:0.00px;animation-delay:3.12s, -0.50s"><polygon points="233.1,128.0 222.1,132.8 215.5,128.0" fill="#ffd27a"/><polygon points="233.1,128.0 215.5,128.0 222.1,123.2" fill="#dd3b25"/><polygon points="233.1,128.0 222.1,132.8 215.5,128.0 222.1,123.2" fill="none" stroke="#0b0d14" stroke-width="1.4" stroke-linejoin="round"/></g><g class="op-shard" style="--sx:2.00px;--sy:3.46px;animation-delay:3.24s, -1.00s"><polygon points="180.5,219.0 170.9,211.9 171.7,203.8" fill="#ffd27a"/><polygon points="180.5,219.0 171.7,203.8 179.2,207.1" fill="#dd3b25"/><polygon points="180.5,219.0 170.9,211.9 171.7,203.8 179.2,207.1" fill="none" stroke="#0b0d14" stroke-width="1.4" stroke-linejoin="round"/></g><g class="op-shard" style="--sx:-2.00px;--sy:3.46px;animation-delay:3.36s, -1.50s"><polygon points="75.5,219.0 76.8,207.1 84.3,203.8" fill="#ffd27a"/><polygon points="75.5,219.0 84.3,203.8 85.1,211.9" fill="#dd3b25"/><polygon points="75.5,219.0 76.8,207.1 84.3,203.8 85.1,211.9" fill="none" stroke="#0b0d14" stroke-width="1.4" stroke-linejoin="round"/></g><g class="op-shard" style="--sx:-4.00px;--sy:0.00px;animation-delay:3.48s, -2.00s"><polygon points="22.9,128.0 33.9,123.2 40.5,128.0" fill="#ffd27a"/><polygon points="22.9,128.0 40.5,128.0 33.9,132.8" fill="#dd3b25"/><polygon points="22.9,128.0 33.9,123.2 40.5,128.0 33.9,132.8" fill="none" stroke="#0b0d14" stroke-width="1.4" stroke-linejoin="round"/></g><g class="op-shard" style="--sx:-2.00px;--sy:-3.46px;animation-delay:3.60s, -2.50s"><polygon points="75.5,37.0 85.1,44.1 84.3,52.2" fill="#ffd27a"/><polygon points="75.5,37.0 84.3,52.2 76.8,48.9" fill="#dd3b25"/><polygon points="75.5,37.0 85.1,44.1 84.3,52.2 76.8,48.9" fill="none" stroke="#0b0d14" stroke-width="1.4" stroke-linejoin="round"/></g></g><polygon class="op-wave" points="128.0,33.9 162.7,67.9 209.5,81.0 197.4,128.0 209.5,175.0 162.7,188.1 128.0,222.1 93.3,188.1 46.5,175.0 58.6,128.0 46.5,81.0 93.3,67.9" fill="none" stroke="#ffc443" stroke-width="1.4" stroke-linejoin="round"/><polygon class="op-wave op-wave--b" points="128.0,33.9 162.7,67.9 209.5,81.0 197.4,128.0 209.5,175.0 162.7,188.1 128.0,222.1 93.3,188.1 46.5,175.0 58.6,128.0 46.5,81.0 93.3,67.9" fill="none" stroke="#ffc443" stroke-width="1.4" stroke-linejoin="round"/></g>
  <!-- placa de fundo e anel -->
  <g class="rank-plate op-plate">
    <polygon points="128.0,27.2 165.2,63.6 215.3,77.6 202.4,128.0 215.3,178.4 165.2,192.4 128.0,228.8 90.8,192.4 40.7,178.4 53.6,128.0 40.7,77.6 90.8,63.6" fill="#1b1f2b" stroke="#0b0d14" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <polygon class="rank-ring op-ring" pathLength="100" points="128.0,33.9 162.7,67.9 209.5,81.0 197.4,128.0 209.5,175.0 162.7,188.1 128.0,222.1 93.3,188.1 46.5,175.0 58.6,128.0 46.5,81.0 93.3,67.9" fill="none" stroke="#ffc443" stroke-width="3" stroke-linejoin="round"/>

  <!-- gema facetada -->
  <g class="rank-gem op-gem">
    <polygon class="op-edge" points="128.0,44.0 159.0,74.3 200.7,86.0 190.0,128.0 200.7,170.0 159.0,181.7 128.0,212.0 97.0,181.7 55.3,170.0 66.0,128.0 55.3,86.0 97.0,74.3" transform="translate(0 4)" fill="#000" opacity=".35"/>
    <polygon class="op-facet" style="--dx:13.2px;--dy:-58.5px;animation-delay:0.35s" points="128.0,44.0 159.0,74.3 143.5,101.2 128.0,86.0" fill="#eebb6d"/><polygon class="op-facet" style="--dx:44.1px;--dy:-40.7px;animation-delay:0.46s" points="159.0,74.3 200.7,86.0 164.4,107.0 143.5,101.2" fill="#ca8a51"/><polygon class="op-facet" style="--dx:57.3px;--dy:-17.9px;animation-delay:0.57s" points="200.7,86.0 190.0,128.0 159.0,128.0 164.4,107.0" fill="#ab5f38"/><polygon class="op-facet" style="--dx:57.3px;--dy:17.9px;animation-delay:0.68s" points="190.0,128.0 200.7,170.0 164.4,149.0 159.0,128.0" fill="#842b19"/><polygon class="op-facet" style="--dx:44.1px;--dy:40.7px;animation-delay:0.78s" points="200.7,170.0 159.0,181.7 143.5,154.8 164.4,149.0" fill="#73130c"/><polygon class="op-facet" style="--dx:13.2px;--dy:58.5px;animation-delay:0.89s" points="159.0,181.7 128.0,212.0 128.0,170.0 143.5,154.8" fill="#70100a"/><polygon class="op-facet" style="--dx:-13.2px;--dy:58.5px;animation-delay:1.00s" points="128.0,212.0 97.0,181.7 112.5,154.8 128.0,170.0" fill="#7f2415"/><polygon class="op-facet" style="--dx:-44.1px;--dy:40.7px;animation-delay:1.11s" points="97.0,181.7 55.3,170.0 91.6,149.0 112.5,154.8" fill="#a35531"/><polygon class="op-facet" style="--dx:-57.3px;--dy:17.9px;animation-delay:1.22s" points="55.3,170.0 66.0,128.0 97.0,128.0 91.6,149.0" fill="#c2804a"/><polygon class="op-facet" style="--dx:-57.3px;--dy:-17.9px;animation-delay:1.33s" points="66.0,128.0 55.3,86.0 91.6,107.0 97.0,128.0" fill="#e9b469"/><polygon class="op-facet" style="--dx:-44.1px;--dy:-40.7px;animation-delay:1.43s" points="55.3,86.0 97.0,74.3 112.5,101.2 91.6,107.0" fill="#facc76"/><polygon class="op-facet" style="--dx:-13.2px;--dy:-58.5px;animation-delay:1.54s" points="97.0,74.3 128.0,44.0 128.0,86.0 112.5,101.2" fill="#fdcf78"/>
    <polygon class="op-table" points="128.0,86.0 143.5,101.2 164.4,107.0 159.0,128.0 164.4,149.0 143.5,154.8 128.0,170.0 112.5,154.8 91.6,149.0 97.0,128.0 91.6,107.0 112.5,101.2" fill="#dd3b25"/>
    <polygon class="op-edge" points="128.0,44.0 159.0,74.3 200.7,86.0 190.0,128.0 200.7,170.0 159.0,181.7 128.0,212.0 97.0,181.7 55.3,170.0 66.0,128.0 55.3,86.0 97.0,74.3" fill="none" stroke="#0b0d14" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- símbolo: a forma do rank em miniatura -->
  <g class="rank-symbol op-symbol">
    <g transform="translate(0 3)" opacity=".3">
      <polygon points="128.0,98.6 138.8,109.2 153.5,113.3 149.7,128.0 153.5,142.7 138.8,146.8 128.0,157.4 117.2,146.8 102.5,142.7 106.3,128.0 102.5,113.3 117.1,109.2" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round"/>
      <polygon points="128.0,110.4 134.5,116.7 143.3,119.2 141.0,128.0 143.3,136.8 134.5,139.3 128.0,145.6 121.5,139.3 112.7,136.8 115.0,128.0 112.7,119.2 121.5,116.7" fill="#000"/>
    </g>
    <polygon points="128.0,98.6 138.8,109.2 153.5,113.3 149.7,128.0 153.5,142.7 138.8,146.8 128.0,157.4 117.2,146.8 102.5,142.7 106.3,128.0 102.5,113.3 117.1,109.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
    <polygon points="128.0,110.4 134.5,116.7 143.3,119.2 141.0,128.0 143.3,136.8 134.5,139.3 128.0,145.6 121.5,139.3 112.7,136.8 115.0,128.0 112.7,119.2 121.5,116.7" fill="#fff"/>
    <polygon points="128.0,128.0 128.0,110.4 134.5,116.7" fill="#ffd27a" opacity=".55"/>
  </g>

  <!-- clarão final da construção -->
  <circle class="op-flash" cx="128" cy="128" r="70" fill="url(#op-flash-grad)"/>
  <!-- brilho (recortado no emblema inteiro) -->
  <g class="rank-shine" mask="url(#op-shine-mask)">
    <polygon class="op-shine" points="-29.3,232.8 6.7,232.8 46.7,23.2 10.7,23.2" fill="url(#op-shine-grad)"/>
  </g>

  <!-- marcadores de tier -->
  <g class="rank-tier"><polygon class="op-tick" style="animation-delay:3.10s" points="83.0,234.8 89.5,242.8 83.0,250.8 76.5,242.8" fill="#ffd27a" stroke="#0b0d14" stroke-width="1.8" stroke-linejoin="round"/><polygon class="op-tick" style="animation-delay:3.55s" points="101.0,234.8 107.5,242.8 101.0,250.8 94.5,242.8" fill="#ffd27a" stroke="#0b0d14" stroke-width="1.8" stroke-linejoin="round"/><polygon class="op-tick" style="animation-delay:4.00s" points="119.0,234.8 125.5,242.8 119.0,250.8 112.5,242.8" fill="#ffd27a" stroke="#0b0d14" stroke-width="1.8" stroke-linejoin="round"/><polygon class="op-tick" style="animation-delay:4.45s" points="137.0,234.8 143.5,242.8 137.0,250.8 130.5,242.8" fill="#ffd27a" stroke="#0b0d14" stroke-width="1.8" stroke-linejoin="round"/><polygon class="op-tick" style="animation-delay:4.90s" points="155.0,234.8 161.5,242.8 155.0,250.8 148.5,242.8" fill="#ffd27a" stroke="#0b0d14" stroke-width="1.8" stroke-linejoin="round"/><polygon class="op-tick" style="animation-delay:5.35s" points="173.0,234.8 179.5,242.8 173.0,250.8 166.5,242.8" fill="#ffd27a" stroke="#0b0d14" stroke-width="1.8" stroke-linejoin="round"/></g>
  </g>
</svg>
